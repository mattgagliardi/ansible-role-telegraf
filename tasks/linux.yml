---
# tasks/linux.yml — Linux-specific Telegraf tasks

# ── Debian/Ubuntu: add InfluxData apt repository ──────────────────────────────

- name: Install apt prerequisites for InfluxData repo
  ansible.builtin.apt:
    name:
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure /etc/apt/trusted.gpg.d directory exists
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d
    state: directory
    mode: '0755'
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Download ASCII-armored InfluxData GPG key
  ansible.builtin.get_url:
    url: "{{ telegraf_repo_key_url }}"
    dest: /tmp/influxdata-archive.asc
    mode: '0644'
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Dearmor InfluxData GPG key to binary format
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/trusted.gpg.d/influxdata-archive.gpg /tmp/influxdata-archive.asc
    creates: /etc/apt/trusted.gpg.d/influxdata-archive.gpg
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Add InfluxData apt repository
  ansible.builtin.template:
    src: influxdata.list.j2
    dest: /etc/apt/sources.list.d/influxdata.list
    owner: root
    group: root
    mode: '0644'
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  notify: Update apt cache
  tags:
    - molecule-idempotence-notest

- name: Flush handlers to update apt cache before package install
  ansible.builtin.meta: flush_handlers

# ── RedHat/Rocky/RHEL: add InfluxData yum/dnf repository ─────────────────────

- name: Download InfluxData GPG key (RedHat)
  ansible.builtin.get_url:
    url: "{{ telegraf_repo_gpgkey }}"
    dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-influxdata
    mode: '0644'
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Import InfluxData GPG key from local file (RedHat)
  ansible.builtin.rpm_key:
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-influxdata
    state: present
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Add InfluxData yum/dnf repository
  ansible.builtin.yum_repository:
    name: influxdata
    description: InfluxData Repository
    baseurl: "{{ telegraf_repo_baseurl }}"
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-influxdata"
    gpgcheck: true
    enabled: true
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

# ── Install Telegraf ──────────────────────────────────────────────────────────

- name: Install Telegraf
  ansible.builtin.package:
    name: "{{ telegraf_package }}"
    state: latest  # noqa package-latest
  become: true

# ── Deploy configuration ──────────────────────────────────────────────────────

- name: Deploy Telegraf configuration
  ansible.builtin.template:
    src: telegraf.conf.linux.j2
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: telegraf
    mode: '0640'
  become: true
  notify: Restart telegraf

# ── Manage systemd service ────────────────────────────────────────────────────

- name: Manage Telegraf systemd service
  ansible.builtin.systemd:
    name: telegraf
    state: "{{ 'started' if telegraf_service_enabled else 'stopped' }}"
    enabled: "{{ telegraf_service_enabled }}"
    daemon_reload: true
  become: true

- name: Flush handlers before retention configuration
  ansible.builtin.meta: flush_handlers
  when:
    - telegraf_service_enabled | bool
    - telegraf_influxdb_v3_enabled | bool
    - telegraf_influxdb_v3_retention_enabled | bool
    - telegraf_influxdb_v3_urls | length > 0

- name: Configure InfluxDB v3 database retention (Linux)
  when:
    - telegraf_service_enabled | bool
    - telegraf_influxdb_v3_enabled | bool
    - telegraf_influxdb_v3_retention_enabled | bool
    - telegraf_influxdb_v3_urls | length > 0
  block:
    - name: Assert telegraf_agent_interval is in seconds format
      ansible.builtin.assert:
        that:
          - telegraf_agent_interval is match('^[0-9]+s$')
        fail_msg: "telegraf_agent_interval must be in seconds format like '10s'"

    - name: Build retention API settings
      ansible.builtin.set_fact:
        telegraf_retention_wait_seconds: "{{ (telegraf_agent_interval | regex_replace('s$', '') | int) + (telegraf_influxdb_v3_retention_wait_extra_seconds | int) }}"
        telegraf_retention_api_url: "{{ telegraf_influxdb_v3_urls[0] | regex_replace('/+$', '') }}"
        telegraf_retention_api_headers: "{{ {'Accept': 'application/json'} | combine((telegraf_influxdb_v3_token | length > 0) | ternary({'Authorization': 'Bearer ' ~ telegraf_influxdb_v3_token}, {})) }}"

    - name: Wait for first Telegraf write window before retention update
      ansible.builtin.pause:
        seconds: "{{ telegraf_retention_wait_seconds }}"

    - name: Check database presence via InfluxDB v3 API
      ansible.builtin.uri:
        url: "{{ telegraf_retention_api_url }}/api/v3/configure/database?format=json"
        method: GET
        headers: "{{ telegraf_retention_api_headers }}"
        return_content: true
        validate_certs: "{{ not (telegraf_influxdb_v3_insecure_skip_verify | bool) }}"
        timeout: "{{ telegraf_influxdb_v3_retention_http_timeout | int }}"
      register: telegraf_retention_db_check
      retries: "{{ telegraf_influxdb_v3_retention_check_retries | int }}"
      delay: "{{ telegraf_influxdb_v3_retention_check_delay | int }}"
      until: >-
        telegraf_retention_db_check.status == 200 and
        (telegraf_retention_db_check.content | default('') is search('"' ~ (telegraf_influxdb_v3_database | regex_escape) ~ '"'))
      changed_when: false
      when: telegraf_influxdb_v3_retention_check_database_presence | bool
      ignore_errors: "{{ telegraf_influxdb_v3_retention_best_effort | bool }}"

    - name: Warn when database presence check does not confirm the target database
      ansible.builtin.debug:
        msg: >-
          Unable to confirm presence of database '{{ telegraf_influxdb_v3_database }}' via
          {{ telegraf_retention_api_url }}/api/v3/configure/database?format=json.
          Skipping retention update because best-effort mode is enabled.
      when:
        - telegraf_influxdb_v3_retention_check_database_presence | bool
        - telegraf_retention_db_check is failed

    - name: Set retention period on InfluxDB v3 database
      ansible.builtin.uri:
        url: "{{ telegraf_retention_api_url }}/api/v3/configure/database/retention_period?db={{ telegraf_influxdb_v3_database | urlencode }}&duration={{ telegraf_influxdb_v3_retention_duration | urlencode }}"
        method: POST
        headers: "{{ telegraf_retention_api_headers }}"
        return_content: true
        status_code:
          - 200
          - 201
          - 204
        validate_certs: "{{ not (telegraf_influxdb_v3_insecure_skip_verify | bool) }}"
        timeout: "{{ telegraf_influxdb_v3_retention_http_timeout | int }}"
      register: telegraf_retention_set
      changed_when: false
      when:
        - not (telegraf_influxdb_v3_retention_check_database_presence | bool) or (telegraf_retention_db_check is not failed)
      ignore_errors: "{{ telegraf_influxdb_v3_retention_best_effort | bool }}"

    - name: Warn when retention update request fails in best-effort mode
      ansible.builtin.debug:
        msg: >-
          Failed to set retention '{{ telegraf_influxdb_v3_retention_duration }}' on database
          '{{ telegraf_influxdb_v3_database }}' at {{ telegraf_retention_api_url }}.
          Continuing because telegraf_influxdb_v3_retention_best_effort is enabled.
      when:
        - telegraf_retention_set is defined
        - telegraf_retention_set is failed
